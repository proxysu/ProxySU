name: Build ProxySU

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION: ProxySU.sln
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Find MSBuild
      id: msbuild
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\VSSetup\Current\Common7\Tools\Launch-VSCodeGen.ps1"
        $msbuild = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
        if (Test-Path $msbuild) {
            Write-Host "Found MSBuild at: $msbuild"
            echo "msbuild_path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
            Write-Host "Looking for VS Build Tools..."
            Get-ChildItem "C:\Program Files" -Recurse -Filter "MSBuild.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }

    - name: Restore NuGet packages
      run: |
        .\.nuget\nuget.exe restore $env:SOLUTION
      shell: cmd

    - name: Build with MSBuild
      run: |
        & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" $env:SOLUTION /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /p:OutputPath=bin\Release\ /v:m
      shell: cmd

    - name: Find built files
      shell: pwsh
      run: |
        Get-ChildItem -Path "ProxySuper.WPF\bin" -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Write-Host "Size: $($_.Length) bytes"
        }

    - name: Copy to publish folder
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path publish | Out-Null
        Copy-Item -Path "ProxySuper.WPF\bin\Release\*" -Destination "publish\" -Recurse -Force
        Get-ChildItem -Path "publish" -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Published: $($_.FullName) - $($_.Length) bytes"
        }

    - name: Create ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "publish\*" -DestinationPath "ProxySU.zip" -Force
        Get-Item "ProxySU.zip" | Select-Object Name, @{N="Size(MB)";E={[math]::Round($_.Length/1MB,2)}}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ProxySU-Build-Release
        path: |
          publish/**/*.exe
          publish/**/*.dll
          publish/**/*.json
          publish/**/*.caddyfile
        retention-days: 30

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ProxySU-ZIP
        path: ProxySU.zip
        retention-days: 30
