name: Build ProxySU

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION: ProxySU.sln
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: '6.x'

    - name: Restore NuGet packages
      run: |
        nuget restore $env:SOLUTION -PackagesDirectory packages

    - name: Build with MSBuild
      run: |
        & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" $env:SOLUTION /p:Configuration=$env:CONFIGURATION /p:Platform="AnyCPU" /p:OutputPath=bin\Release\ /p:BaseIntermediateOutputPath=obj\ /v:m
      shell: cmd

    - name: Find built files
      shell: pwsh
      run: |
        Get-ChildItem -Path "ProxySuper.WPF\bin" -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
        }

    - name: Copy to publish folder
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path publish | Out-Null
        Copy-Item -Path "ProxySuper.WPF\bin\Release\ProxySuper.WPF\*" -Destination "publish\" -Recurse -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "ProxySuper.WPF\bin\Release\*" -Destination "publish\" -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem -Path "publish" -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Published: $($_.Name)"
        }

    - name: Create ZIP
      shell: pwsh
      run: |
        if (Test-Path "publish\*") {
            Compress-Archive -Path "publish\*" -DestinationPath "ProxySU.zip" -Force
            Get-Item "ProxySU.zip" | Select-Object Name, @{N="Size(MB)";E={[math]::Round($_.Length/1MB,2)}}
        } else {
            Write-Host "No files in publish folder!"
            Get-ChildItem -Path "." -Recurse -Filter "*.exe" | Select-Object FullName
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ProxySU-Build-${{ github.run_number }}
        path: |
          ProxySU.zip
          publish/**/*.exe
        retention-days: 30
