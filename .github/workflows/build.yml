name: Build ProxySU

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  SOLUTION: ProxySU.sln
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
      with:
        nuget-version: '6.x'

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        nuget restore $env:SOLUTION -PackagesDirectory ./packages

    - name: Build with MSBuild
      id: build
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = $null
        
        # Try vswhere first
        if (Test-Path $vswhere) {
            $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\\**\\Bin\\MSBuild.exe | Select-Object -First 1
            if ($path -and (Test-Path $path)) {
                $msbuild = $path
            }
        }
        
        # Fallback paths
        if (-not $msbuild) {
            $paths = @(
                "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
                "C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe",
                "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe",
                "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"
            )
            foreach ($p in $paths) {
                if (Test-Path $p) { $msbuild = $p; break }
            }
        }
        
        if (-not $msbuild) {
            Write-Error "MSBuild not found!"
            exit 1
        }
        
        Write-Host "Using MSBuild: $msbuild"
        & "$msbuild" $env:SOLUTION /p:Configuration=$env:CONFIGURATION /p:Platform="Any CPU" /p:OutputPath=bin\Release\ /p:BaseIntermediateOutputPath=obj\ /v:m /nologo

    - name: Find built files
      if: success()
      shell: pwsh
      run: |
        Get-ChildItem -Path "." -Directory -Recurse -Filter "Release" | ForEach-Object {
            Get-ChildItem -Path $_.FullName -Filter "*.exe" -Recurse | ForEach-Object {
                Write-Host "Found: $($_.FullName) - Size: $([math]::Round($_.Length/1KB,2)) KB"
            }
        }

    - name: Copy to publish folder
      if: success()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path publish | Out-Null
        Get-ChildItem -Path "." -Directory -Recurse -Filter "Release" | ForEach-Object {
            $releasePath = $_.FullName
            Get-ChildItem -Path $releasePath -Recurse | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination "publish\" -Force
            }
        }
        Get-ChildItem -Path "." -Directory -Recurse -Filter "Templates" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "publish\" -Recurse -Force -ErrorAction SilentlyContinue
        }
        Get-ChildItem -Path "." -Directory -Recurse -Filter "Resources" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "publish\" -Recurse -Force -ErrorAction SilentlyContinue
        }

    - name: Create ZIP
      if: success()
      shell: pwsh
      run: |
        if ((Get-ChildItem "publish" -Recurse | Measure-Object).Count -gt 0) {
            Compress-Archive -Path "publish\*" -DestinationPath "ProxySU.zip" -Force
            Get-Item "ProxySU.zip" | Select-Object Name, @{N="Size(MB)";E={[math]::Round($_.Length/1MB,2)}}
        }

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ProxySU-Build-${{ github.run_number }}
        path: |
          ProxySU.zip
          publish/**/*.exe
        retention-days: 30
